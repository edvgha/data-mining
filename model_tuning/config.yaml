# Template based on report(1).html, which contains statistics, not training rows.
# VERIFY target and time column names against your actual Parquet schema.
target: clickoccurrred  # Exact requested spelling; no automatic aliasing.
time_column: search_date
features:
  widgetid: categorical
  media_channel: categorical
  media_type: categorical
  inventory_type: categorical
  devicetype: categorical
  stateid: categorical
  listingset: numerical
  advertiser_accountid: categorical
  publisher_accountid: categorical
  service_code: categorical
  position: numerical
  search_device_display_height: numerical
  base_inventorytype: categorical
  widgetposition: categorical
  mbt_star_rating: numerical
  apy: numerical
  term_months: numerical
  compounding_method: categorical
  mindeposit: numerical
# Starting candidate list, not validated feature selection. Omitted identity/twin candidates:
# listing_style_id, advertiser_customerid, publisher_customerid, rateproductids.
# click_or_ref_url_host is quarantined until confirmed available before prediction.
# Review omissions through separate pre-test validation experiments.
group_by:
  - [publisher_accountid, service_code]
  - [publisher_accountid]
  - [service_code]
output_dir: ../report/model_tuning
seed: 42
nthread: 4
split:
  train_fraction: 0.6
  validation_fraction: 0.2
  early_stopping_fraction: 0.15
  # Alternatively set BOTH inclusive UTC cutoffs:
  # train_end: '2026-06-30T23:59:59Z'
  # validation_end: '2026-07-31T23:59:59Z'
  gap: 0D  # Increase for label maturity / session duration.
  entity_column: null  # e.g. searchid: fail if the ID crosses partitions.
bootstrap:
  method: time_block  # time_block | cluster | row
  time_frequency: 1D  # Fixed non-overlapping blocks; consider 7D for weekly dependence.
  cluster_column: null  # For method: cluster, e.g. searchid.
  n_resamples: 200
  confidence: 0.95
  training_repeats: 5
tuning:
  n_trials: 30
  timeout_seconds: null
  num_boost_round: 1000
  early_stopping_rounds: 50
  stability_penalty: 1.0
  params: {}
  search_space:
    eta: {type: float, low: 0.02, high: 0.2, log: true}
    max_depth: {type: int, low: 3, high: 8}
    min_child_weight: {type: float, low: 1.0, high: 100.0, log: true}
    subsample: {type: float, low: 0.6, high: 1.0}
    colsample_bytree: {type: float, low: 0.6, high: 1.0}
    lambda: {type: float, low: 0.01, high: 100.0, log: true}
    alpha: {type: float, low: 1.0e-8, high: 10.0, log: true}
report:
  shap_rows: 2000
  plot_top_features: 20
  min_group_rows: 100
  min_group_clicks: 10
  save_predictions: false
