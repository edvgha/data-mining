# Synthetic demo: 1,000,000 rows, 27 columns, generation seed 42.
# This configuration matches data.parquet in this directory.
# Synthetic precision: APY has two decimal places; assets have two significant digits.
# Use the exact target name in your Parquet file.
target: clickoccured

# The declared type is semantic: integer identifiers are categorical.
features:
  rank_pos: numerical
  apy: numerical
  apy_rank_on_widget: numerical
  min_investment_amount: numerical
  term_months: numerical
  listing_set: categorical
  mbt_star_rating: numerical
  assets_usd: numerical
  popularity_tier_national: categorical
  trust_tier_1to5: numerical
  widget_pos: numerical
  inventory_type: categorical
  widget_id: categorical
  device_type_id: categorical
  compounding_method: categorical
  state_code: categorical
  advertiser_customer_id: categorical
  advertiser_account_id: categorical
  listing_style_id: categorical
  publisher.accountid: categorical
  media_channel: categorical
  publisher_customer_id: categorical
  service_code: categorical
  week_day: categorical

# Optional context columns are analyzed but are not candidate input features.
time_column: search_date
time_frequency: W
group_column: searchid
ignore: []
strict_schema: true
output_dir: ../report  # Keep generated reports outside the demo input folder.

bins: 10
max_categories: 20
rare_min_count: 100
min_cell_count: 200
min_cell_events: 10
sample_rows: 100000
seed: 42
max_pairs: 500
max_joint_cells: 20000
max_time_periods: 120

# Explicit hypotheses: selected pairs and triples, without fitting a model.
interactions:
  - [rank_pos, device_type_id]
  - [apy, term_months]
  - [listing_set, inventory_type]
  - [media_channel, device_type_id, rank_pos]

# Include/exclude individual metric names. Exclude wins if a name appears in both.
# Use include: [cohens_d, auc, mutual_information, spearman, positive_rate] for a smaller audit.
statistics:
  include: all
  exclude: [hedges_g]

# Direction of association expected with label=1, not a causal constraint.
expected_direction:
  rank_pos: negative
  apy: positive
  apy_rank_on_widget: negative
  widget_pos: negative

# Decisions are independent from metric switches. Missing required metrics cause
# a rule to be SKIPPED with an explanation. Actions: keep, review, exclude.
rules:
  all_missing: {enabled: true, action: exclude}
  constant: {enabled: true, action: exclude}
  missingness: {enabled: true, threshold: 0.8, action: review}
  near_constant: {enabled: true, threshold: 0.995, action: review}
  high_cardinality: {enabled: true, threshold: 1000, action: review}
  weak_signal:
    enabled: true
    max_abs_d: 0.05
    max_auc_distance: 0.02
    max_mi: 0.0001
    action: review
  direction:
    enabled: true
    min_abs_d: 0.05
    min_auc_distance: 0.02
    action: review
  redundancy:
    enabled: true
    metric: spearman
    threshold: 0.95
    sign: absolute  # positive, negative, or absolute
    min_pair_rows: 1000
    min_pair_fraction: 0.5
    action: exclude

# Precedence and representative selection.
force_keep: []
force_exclude: []
prefer: [rank_pos, apy]
protect_configured_interactions: true
