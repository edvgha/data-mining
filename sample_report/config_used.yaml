statistics:
  include: all
  exclude:
  - hedges_g
rules:
  all_missing:
    enabled: true
    action: exclude
  constant:
    enabled: true
    action: exclude
  missingness:
    enabled: true
    action: review
    threshold: 0.8
  near_constant:
    enabled: true
    action: review
    threshold: 0.995
  high_cardinality:
    enabled: true
    action: review
    threshold: 1000
  weak_signal:
    enabled: true
    action: review
    max_abs_d: 0.05
    max_auc_distance: 0.02
    max_mi: 0.0001
  direction:
    enabled: true
    action: review
    min_abs_d: 0.05
    min_auc_distance: 0.02
  redundancy:
    enabled: true
    action: exclude
    metric: spearman
    threshold: 0.95
    sign: absolute
    min_pair_rows: 1000
    min_pair_fraction: 0.5
expected_direction:
  rank_pos: negative
  apy: positive
  apy_rank_on_widget: negative
  widget_pos: negative
force_keep: []
force_exclude: []
prefer:
- rank_pos
- apy
protect_configured_interactions: true
output_dir: report
ignore: []
time_column: search_date
group_column: searchid
time_frequency: W
strict_schema: true
bins: 10
max_categories: 20
rare_min_count: 100
min_cell_count: 200
min_cell_events: 10
sample_rows: 100000
seed: 42
max_pairs: 500
max_joint_cells: 20000
interactions:
- - rank_pos
  - device_type_id
- - apy
  - term_months
- - listing_set
  - inventory_type
- - media_channel
  - device_type_id
  - rank_pos
max_time_periods: 120
target: clickoccured
features:
  rank_pos: numerical
  apy: numerical
  apy_rank_on_widget: numerical
  min_investment_amount: numerical
  term_months: numerical
  listing_set: categorical
  mbt_star_rating: numerical
  assets_usd: numerical
  popularity_tier_national: categorical
  trust_tier_1to5: numerical
  widget_pos: numerical
  inventory_type: categorical
  widget_id: categorical
  device_type_id: categorical
  compounding_method: categorical
  state_code: categorical
  advertiser_customer_id: categorical
  advertiser_account_id: categorical
  listing_style_id: categorical
  publisher.accountid: categorical
  media_channel: categorical
  publisher_customer_id: categorical
  service_code: categorical
  week_day: categorical
